<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>فوضى التحديات - مغامرة 3D</title>
<style>
:root{--glass:rgba(13,22,39,.72);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d32;font-family:system-ui,Tahoma,Arial;color:#fff;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:9px 13px;backdrop-filter:blur(10px);box-shadow:0 8px 28px #0004}
.stat{font-weight:800;font-size:14px}.stat small{display:block;font-size:10px;opacity:.72;font-weight:600}
#message{position:absolute;top:86px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#101b30c9;padding:9px 16px;border:1px solid var(--line);border-radius:20px;font-size:13px}
#joystick{position:absolute;bottom:24px;left:22px;width:138px;height:138px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff4a;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 20px #0003}
#stick{position:absolute;left:40px;top:40px;width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#fff,#a9c9ff);box-shadow:0 5px 16px #0007;border:2px solid #fff}
.actions{position:absolute;bottom:28px;right:20px;display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.action{border:2px solid #ffffff80;border-radius:50%;width:68px;height:68px;color:white;font-weight:900;font-size:13px;background:linear-gradient(145deg,#ff9e38,#ed4d64);box-shadow:0 7px 18px #0006;touch-action:none}
#jump{width:78px;height:78px;background:linear-gradient(145deg,#48d6c8,#1685d4)}
#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;border:0;border-radius:18px;padding:15px 28px;color:#fff;font-weight:900;font-size:18px;background:linear-gradient(120deg,#ff8a36,#e83f75);box-shadow:0 12px 35px #0008}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.75;white-space:nowrap}
@media(min-width:700px){#joystick{width:150px;height:150px}#stick{left:46px;top:46px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="top">
  <div class="panel stat">🪙 <span id="coins">0</span><small>العملات</small></div>
  <div class="panel stat">🏆 <span id="score">0</span><small>النقاط</small></div>
  <div class="panel stat">⏱️ <span id="time">60</span><small>الوقت</small></div>
 </div>
 <div id="message">استكشف الساحة واجمع العملات!</div>
 <button id="start">ابدأ المغامرة 🎮</button>
 <div id="joystick"><div id="stick"></div></div>
 <div class="actions"><button class="action" id="jump">قفز</button><button class="action" id="run">جري</button></div>
 <div id="hint">حرّك العصا في أي اتجاه — الكاميرا تتبعك من الخلف</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.getElementById('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8ed8ff); scene.fog=new THREE.Fog(0x8ed8ff,28,90);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf8ff,0x6d7f53,2.0));
const sun=new THREE.DirectionalLight(0xfff2d5,2.4); sun.position.set(-12,22,10); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const grass=mat(0x5ebd68), path=mat(0xd8bd86), rock=mat(0x7f91a5), wood=mat(0x80502f), leaf=mat(0x248b58), gold=new THREE.MeshStandardMaterial({color:0xffc928,metalness:.65,roughness:.25,emissive:0x684300});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),grass);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const trail=new THREE.Mesh(new THREE.PlaneGeometry(7,100),path);trail.rotation.x=-Math.PI/2;trail.position.set(0,.012,0);trail.receiveShadow=true;scene.add(trail);
function box(w,h,d,material,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function tree(x,z,s=1){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.32*s,2*s,8),wood);trunk.position.set(x,s,z);trunk.castShadow=true;scene.add(trunk);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.25*s,1),leaf);crown.position.set(x,2.5*s,z);crown.castShadow=true;scene.add(crown);let crown2=new THREE.Mesh(new THREE.IcosahedronGeometry(.8*s,1),mat(0x39aa65));crown2.position.set(x+.45*s,2.9*s,z-.2*s);scene.add(crown2)}
for(let z=-42;z<48;z+=9){tree(-7-(Math.sin(z)*1.5),z,.8+Math.abs(Math.sin(z))*.25);tree(7+(Math.cos(z)*1.5),z,.85+Math.abs(Math.cos(z))*.2)}
// decorative rocks and stepping platforms
for(let i=0;i<16;i++){let x=(Math.sin(i*8.1)*1.8)+(i%2?3.5:-3.5),z=-35+i*4.5;let r=new THREE.Mesh(new THREE.DodecahedronGeometry(.65+(i%3)*.18),rock);r.position.set(x,.45,z);r.scale.y=.7;r.castShadow=true;scene.add(r)}
// animal adventurer: cute fox-like character
const player=new THREE.Group();scene.add(player);
const orange=mat(0xf28b35),cream=mat(0xffe3b8),dark=mat(0x392b38),eye=mat(0x171923,.3);
function sph(parent,geo,material,x,y,z,sx=1,sy=1,sz=1){let o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;parent.add(o);return o}
sph(player,new THREE.SphereGeometry(.55,24,18),orange,0,1.05,0, .82,1.05,.68);
sph(player,new THREE.SphereGeometry(.48,24,18),orange,0,1.85,-.03,1, .9,.9);
sph(player,new THREE.SphereGeometry(.29,20,16),cream,0,1.67,.37,1,.65,.45);
sph(player,new THREE.SphereGeometry(.09,16,12),dark,0,1.78,.72,1,1,.7);
for(let side of [-1,1]){sph(player,new THREE.ConeGeometry(.2,.55,12),orange,side*.31,2.35,-.05,1,1,1).rotation.z=side*-.22;sph(player,new THREE.SphereGeometry(.075,12,10),eye,side*.19,1.96,.72,.8,1,.5)}
const tail=sph(player,new THREE.ConeGeometry(.28,.9,16),orange,0,.85,-.72);tail.rotation.x=-1.0;
for(let side of [-1,1]){let leg=sph(player,new THREE.CapsuleGeometry(.13,.42,4,8),dark,side*.25,.35,0);leg.rotation.x=.12}
player.position.set(0,0,8);
// coin line with varied positions
const coins=[];
for(let i=0;i<12;i++){let c=new THREE.Mesh(new THREE.TorusGeometry(.38,.12,10,24),gold);c.position.set(Math.sin(i*1.7)*3.2,1.25,-5-i*5.5);c.castShadow=true;scene.add(c);coins.push(c)}
// colorful checkpoint arches
for(let z=-16;z>-48;z-=16){let a=box(.35,3,.35,mat(0x4d7bdb),-3.4,1.5,z);let b=box(.35,3,.35,mat(0x4d7bdb),3.4,1.5,z);box(6.8,.35,.35,mat(0xf4b942),0,3,z)}
// movement state
let active=false,remaining=60,collected=0,score=0,velocityY=0,onGround=true,move={x:0,y:0},running=false;
let yaw=0;const clock=new THREE.Clock();
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let joyId=null;
function setJoy(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=48;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;move.x=dx/max;move.y=-dy/max}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
function resetJoy(){joyId=null;move={x:0,y:0};stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(active&&onGround){velocityY=8.5;onGround=false}});
document.getElementById('run').addEventListener('pointerdown',()=>running=true);document.getElementById('run').addEventListener('pointerup',()=>running=false);document.getElementById('run').addEventListener('pointerleave',()=>running=false);
addEventListener('keydown',e=>{if(e.key===' '&&onGround&&active){velocityY=8.5;onGround=false} if(e.key==='Shift')running=true});
addEventListener('keyup',e=>{if(e.key==='Shift')running=false});
document.getElementById('start').onclick=()=>{active=true;remaining=60;collected=0;score=0;player.position.set(0,0,8);document.getElementById('start').style.display='none';document.getElementById('message').textContent='انطلق! اجمع العملات وتجاوز العقبات';document.getElementById('coins').textContent='0';document.getElementById('score').textContent='0'};
function update(dt){
 if(active){remaining-=dt;if(remaining<=0){remaining=0;active=false;document.getElementById('start').textContent='العب مرة تانية 🔄';document.getElementById('start').style.display='block';document.getElementById('message').textContent=`انتهت المغامرة! جمعت ${collected} عملة`;}
 let forward=move.y,side=move.x;let mag=Math.hypot(forward,side);if(mag>.08){let speed=(running?10:6)*Math.min(mag,1);let desired=Math.atan2(side,forward);yaw=desired;player.rotation.y=yaw;player.position.x+=Math.sin(yaw)*speed*dt;player.position.z-=Math.cos(yaw)*speed*dt}
 player.position.x=THREE.MathUtils.clamp(player.position.x,-5.5,5.5);
 velocityY-=20*dt;player.position.y+=velocityY*dt;if(player.position.y<=0){player.position.y=0;velocityY=0;onGround=true}
 for(let c of coins){if(c.visible&&player.position.distanceTo(c.position)<1.35){c.visible=false;collected++;score+=100;document.getElementById('coins').textContent=collected;document.getElementById('score').textContent=score;document.getElementById('message').textContent='عملة جديدة! ممتاز 🪙'}}
 }
 for(let c of coins){if(c.visible){c.rotation.y+=dt*2.2;c.position.y=1.25+Math.sin(clock.elapsedTime*2+c.position.z)*.16}}
 // chase camera behind the character, smoothly following heading
 const behind=new THREE.Vector3(Math.sin(yaw)*8,5.2,Math.cos(yaw)*8);
 const targetCam=player.position.clone().add(behind);camera.position.lerp(targetCam,1-Math.pow(.001,dt));camera.lookAt(player.position.x,1.25,player.position.z-1.2);
 document.getElementById('time').textContent=Math.ceil(remaining);
}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
