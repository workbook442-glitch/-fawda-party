<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>فوضى التحديات - مغامرة 3D V9</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed8ff;color:#fff;font-family:system-ui,Tahoma,Arial;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:7px}.panel{background:#101b30c9;border:1px solid #ffffff40;border-radius:15px;padding:8px 12px;backdrop-filter:blur(8px);font-weight:900;font-size:14px}.panel small{display:block;font-size:10px;opacity:.75}#message{position:absolute;top:75px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#101b30c9;border:1px solid #ffffff40;border-radius:20px;padding:9px 14px;font-size:12px}#joystick{position:absolute;bottom:23px;left:20px;width:138px;height:138px;border-radius:50%;background:#ffffff25;border:2px solid #ffffff65;pointer-events:auto;touch-action:none}#stick{position:absolute;left:40px;top:40px;width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#fff,#9dc7ff);box-shadow:0 5px 16px #0007;border:2px solid white}.actions{position:absolute;bottom:28px;right:18px;display:flex;gap:10px;pointer-events:auto}.action{border:2px solid #ffffff90;border-radius:50%;width:68px;height:68px;color:white;font-weight:900;background:linear-gradient(145deg,#ff9e38,#ed4d64);box-shadow:0 7px 18px #0006;touch-action:none}#jump{width:78px;height:78px;background:linear-gradient(145deg,#48d6c8,#1685d4)}#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;border:0;border-radius:18px;padding:15px 25px;color:white;font-weight:900;font-size:18px;background:linear-gradient(120deg,#ff8a36,#e83f75);box-shadow:0 12px 35px #0008}#hint{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;text-shadow:0 2px 5px #000}@media(max-width:380px){.panel{font-size:12px;padding:7px 9px}#message{font-size:10px}}
</style></head><body><div id="game"></div><div id="hud"><div class="top"><div class="panel">🪙 <span id="coins">0</span><small>العملات</small></div><div class="panel">🏆 <span id="score">0</span><small>النقاط</small></div><div class="panel">⏱️ <span id="time">75</span><small>الوقت</small></div></div><div id="message">V9 — اقفز فوق العوائق واجمع العملات!</div><button id="start">ابدأ المغامرة 🎮</button><div id="joystick"><div id="stick"></div></div><div class="actions"><button class="action" id="jump">قفز</button><button class="action" id="run">جري</button></div><div id="hint">العصاية الشمال للحركة • اسحب يمين الشاشة لتحريك الكاميرا</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x8ed8ff);scene.fog=new THREE.Fog(0x8ed8ff,35,105);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf8ff,0x71865d,2.1));const sun=new THREE.DirectionalLight(0xfff2d5,2.3);sun.position.set(-12,24,10);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const grass=mat(0x4fae61),path=mat(0xd9bd8d),wood=mat(0x80502f),gold=mat(0xffc928,.25,.6),rock=mat(0x8495a8);
function add(mesh,x,y,z,sh=true){mesh.position.set(x,y,z);mesh.castShadow=sh;mesh.receiveShadow=true;scene.add(mesh);return mesh}function box(w,h,d,m,x,y,z){return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m),x,y,z)}
add(new THREE.Mesh(new THREE.PlaneGeometry(100,150),grass),0,-.08,-20).rotation.x=-Math.PI/2;add(new THREE.Mesh(new THREE.PlaneGeometry(7,150),path),0,0,-20).rotation.x=-Math.PI/2;
for(let z=-85;z<55;z+=9)for(const x of [-1,1]){let px=x*(7+Math.sin(z)*1.3);let trunk=add(new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,2,9),wood),px,1,z);for(let k=0;k<3;k++)add(new THREE.Mesh(new THREE.IcosahedronGeometry(1-k*.12,1),mat([0x23884f,0x2e9b58,0x43ad65][k])),px+(k-1)*.3,2.1+k*.42,z+(k%2)*.2)}
for(let i=0;i<22;i++){let x=(i%2?1:-1)*(4.5+(i%4)*.6),z=-12-i*3.2;let p=add(new THREE.Mesh(new THREE.DodecahedronGeometry(.55+(i%3)*.12),rock),x,.35,z);p.scale.y=.7}
// decorative floating pennants and checkpoint arches
for(let z=-18;z>-75;z-=19){box(.22,3,.22,mat(0x4d7bdb),-3.35,1.5,z);box(.22,3,.22,mat(0x4d7bdb),3.35,1.5,z);box(6.7,.28,.28,mat(0xf4b942),0,3,z)}
// Fox adventurer, built from articulated rounded meshes
const player=new THREE.Group();scene.add(player);const torso=new THREE.Group();player.add(torso);const orange=mat(0xf47d32),cream=mat(0xffe8c9),dark=mat(0x30263a),white=mat(0xffffff),eye=mat(0x171923),blue=mat(0x246da7),red=mat(0xe84d59),trim=mat(0xffcf62,.35,.2),pink=mat(0xff9b9f);
function sph(parent,g,m,x,y,z,sx=1,sy=1,sz=1){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function limb(parent,x,y,z,m){let p=new THREE.Group();p.position.set(x,y,z);parent.add(p);sph(p,new THREE.CapsuleGeometry(.14,.42,5,10),m,0,-.2,0);return p}
sph(torso,new THREE.SphereGeometry(.55,28,22),orange,0,1.08,0,.9,1,.75);sph(torso,new THREE.SphereGeometry(.48,28,22),orange,0,1.94,0,1,.9,.86);sph(torso,new THREE.SphereGeometry(.31,20,16),cream,0,1.77,.42,1,.7,.5);
for(let s of [-1,1]){let ear=sph(torso,new THREE.ConeGeometry(.22,.65,14),orange,s*.32,2.53,-.02);ear.rotation.z=-s*.18;sph(torso,new THREE.ConeGeometry(.1,.36,12),pink,s*.32,2.54,.1);sph(torso,new THREE.SphereGeometry(.105,16,12),white,s*.19,2.02,.72,1,1,.45);sph(torso,new THREE.SphereGeometry(.07,14,10),eye,s*.19,2.02,.78);sph(torso,new THREE.SphereGeometry(.025,8,8),white,s*.21,2.05,.83);sph(torso,new THREE.SphereGeometry(.07,12,10),pink,s*.34,1.78,.67,1.2,.6,.3)}
sph(torso,new THREE.SphereGeometry(.2,18,14),cream,0,1.72,.76,1.25,.7,.7);sph(torso,new THREE.SphereGeometry(.07,12,10),dark,0,1.82,.91);sph(torso,new THREE.SphereGeometry(.47,24,18),blue,0,1.12,-.02,.95,.9,.78);sph(torso,new THREE.SphereGeometry(.25,18,14),cream,0,1.12,.42,1,.8,.3);sph(torso,new THREE.TorusGeometry(.42,.09,9,28),red,0,1.5,-.02,1,1,.8).rotation.x=Math.PI/2;sph(torso,new THREE.BoxGeometry(.45,.55,.25),blue,0,1.18,-.55);sph(torso,new THREE.TorusGeometry(.39,.045,8,24),wood,0,.72,0,1,1,.8).rotation.x=Math.PI/2;sph(torso,new THREE.BoxGeometry(.16,.15,.06),trim,0,.72,.38);
const arms=[limb(torso,-.54,1.42,0,orange),limb(torso,.54,1.42,0,orange)],legs=[limb(player,-.24,.5,0,dark),limb(player,.24,.5,0,dark)];for(let i=0;i<2;i++){sph(arms[i],new THREE.SphereGeometry(.14,14,12),cream,0,-.43,.02);sph(legs[i],new THREE.SphereGeometry(.19,14,12),dark,0,-.39,.12,1,.6,1.3);sph(legs[i],new THREE.CylinderGeometry(.17,.18,.1,14),trim,0,-.27,0)}const tail=new THREE.Group();tail.position.set(0,.85,-.45);player.add(tail);sph(tail,new THREE.ConeGeometry(.34,1.05,18),orange,0,0,-.4).rotation.x=-.9;sph(tail,new THREE.SphereGeometry(.24,16,12),cream,0,-.35,-.75,1,1,.9);player.position.set(0,0,8);
// collectible coins
const coins=[];for(let i=0;i<18;i++){let c=add(new THREE.Mesh(new THREE.TorusGeometry(.34,.105,10,22),gold),Math.sin(i*1.7)*2.65,1.25,-6-i*4.5);coins.push(c)}
// moving sweepers: glowing padded bars across the path; jump over them
const hazards=[];for(let i=0;i<5;i++){let g=new THREE.Group();scene.add(g);let bar=new THREE.Mesh(new THREE.BoxGeometry(2.0,.48,.65),mat(0xef5365,.35));g.add(bar);let cap1=new THREE.Mesh(new THREE.SphereGeometry(.25,14,12),mat(0xffd36a));cap1.position.x=-1;g.add(cap1);let cap2=cap1.clone();cap2.position.x=1;g.add(cap2);g.position.set(0,.55,-13-i*13);g.userData.phase=i*1.7;hazards.push(g)}
// spring pads and raised stepping platforms as optional routes
const pads=[];for(let i=0;i<5;i++){let z=-20-i*13,x=(i%2?1:-1)*2.15;let p=add(new THREE.Mesh(new THREE.CylinderGeometry(.75,.85,.22,24),mat(0x35c9bb,.3,.2)),x,.12,z);let ring=add(new THREE.Mesh(new THREE.TorusGeometry(.58,.07,8,28),gold),x,.27,z);ring.rotation.x=Math.PI/2;pads.push({mesh:p,x,z,ring})}
// impact and pickup particles
const particles=[];function burst(pos,color,count=12){for(let i=0;i<count;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.055+Math.random()*.04,8,7),mat(color,.4));m.position.copy(pos);scene.add(m);particles.push({mesh:m,vel:new THREE.Vector3((Math.random()-.5)*4,1+Math.random()*4,(Math.random()-.5)*4),life:.65})}}
let active=false,remaining=75,collected=0,score=0,vy=0,onGround=true,move={x:0,y:0},running=false,yaw=0,camYaw=0,camPitch=0,phase=0,lastVX=0,lastVZ=0;const velocity=new THREE.Vector3(),clock=new THREE.Clock(),look=new THREE.Vector3(0,1.3,0),desired=new THREE.Vector3();const joy=document.querySelector('#joystick'),stick=document.querySelector('#stick');let joyId=null;
function setJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),max=48;if(l>max){dx=dx/l*max;dy=dy/l*max}stick.style.transform=`translate(${dx}px,${dy}px)`;let p=Math.max(0,(l/max-.1)/.9);move.x=(l?dx/l:0)*p;move.y=(l?-dy/l:0)*p}joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});function resetJoy(){joyId=null;move={x:0,y:0};stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
let camId=null,cx=0,cy=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.42)return;camId=e.pointerId;cx=e.clientX;cy=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==camId)return;camYaw-=(e.clientX-cx)*.0065;camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-cy)*.004,-.25,.42);cx=e.clientX;cy=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===camId)camId=null});
function jump(){if(active&&onGround){vy=8.7;onGround=false;burst(player.position.clone().add(new THREE.Vector3(0,.1,0)),0x74f5e8,7)}}document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#run').addEventListener('pointerdown',()=>running=true);['pointerup','pointercancel','pointerleave'].forEach(ev=>document.querySelector('#run').addEventListener(ev,()=>running=false));addEventListener('keydown',e=>{if(e.code==='Space')jump();if(e.key==='Shift')running=true});addEventListener('keyup',e=>{if(e.key==='Shift')running=false});
function start(){active=true;remaining=75;collected=score=0;velocity.set(0,0,0);vy=0;onGround=true;phase=0;player.position.set(0,0,8);yaw=camYaw=camPitch=0;coins.forEach(c=>c.visible=true);document.querySelector('#coins').textContent='0';document.querySelector('#score').textContent='0';document.querySelector('#start').style.display='none';document.querySelector('#message').textContent='انطلق! اقفز فوق الحواجز واجمع العملات';}document.querySelector('#start').onclick=start;
function update(dt,t){if(active){remaining-=dt;if(remaining<=0){remaining=0;active=false;document.querySelector('#start').textContent='العب مرة تانية 🔄';document.querySelector('#start').style.display='block';document.querySelector('#message').textContent=`انتهت الجولة! جمعت ${collected} عملة`}
let power=Math.min(1,Math.hypot(move.x,move.y)),targetYaw=power>.06?camYaw+Math.atan2(move.x,move.y):yaw;if(power>.06){let d=Math.atan2(Math.sin(targetYaw-yaw),Math.cos(targetYaw-yaw));yaw+=d*(1-Math.exp(-9*dt))}let speed=(running?10.5:6.2)*power;velocity.x=THREE.MathUtils.damp(velocity.x,Math.sin(yaw)*speed,power>.06?7.5:10,dt);velocity.z=THREE.MathUtils.damp(velocity.z,-Math.cos(yaw)*speed,power>.06?7.5:10,dt);if(power<.01){velocity.x=THREE.MathUtils.damp(velocity.x,0,11,dt);velocity.z=THREE.MathUtils.damp(velocity.z,0,11,dt)}if(Math.hypot(velocity.x,velocity.z)>.12){player.rotation.y=yaw;player.position.x+=velocity.x*dt;player.position.z+=velocity.z*dt}player.position.x=THREE.MathUtils.clamp(player.position.x,-5.4,5.4);vy-=20*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}
for(let c of coins)if(c.visible&&player.position.distanceTo(c.position)<1.15){c.visible=false;collected++;score+=100;document.querySelector('#coins').textContent=collected;document.querySelector('#score').textContent=score;document.querySelector('#message').textContent='رائع! عملة جديدة 🪙';burst(c.position,0xffd43b,16)}
for(let h of hazards){h.position.x=Math.sin(t*1.35+h.userData.phase)*1.45;if(Math.abs(player.position.z-h.position.z)<.8&&Math.abs(player.position.x-h.position.x)<1.35&&player.position.y<.85){player.position.z+=2.3;velocity.multiplyScalar(.25);score=Math.max(0,score-50);document.querySelector('#score').textContent=score;document.querySelector('#message').textContent='خد بالك من الحاجز! حاول تقفز 😅';burst(player.position.clone().add(new THREE.Vector3(0,.6,0)),0xff765e,10)}}
for(let p of pads)if(Math.abs(player.position.z-p.z)<.8&&Math.abs(player.position.x-p.x)<.8&&onGround){vy=11;onGround=false;document.querySelector('#message').textContent='قفزة خارقة! 🚀';burst(p.mesh.position.clone().add(new THREE.Vector3(0,.4,0)),0x55fff0,18)} }
for(let c of coins)if(c.visible){c.rotation.y+=dt*2.4;c.position.y=1.25+Math.sin(t*2+c.position.z)*.15}hazards.forEach((h,i)=>{h.rotation.y=Math.sin(t*1.4+h.userData.phase)*.16});pads.forEach(p=>p.ring.rotation.z+=dt*.7);
let sp=Math.hypot(velocity.x,velocity.z),walking=active&&sp>.2,air=player.position.y>.03;if(walking&&onGround)phase+=dt*(running?13.5:9)*Math.min(1,sp/6);let s=Math.sin(phase),o=Math.sin(phase+Math.PI);legs[0].rotation.x=air?-.45:s*.7;legs[1].rotation.x=air?-.45:o*.7;arms[0].rotation.x=air?-.8:-s*.5;arms[1].rotation.x=air?-.8:-o*.5;torso.position.y=air?0:(walking?Math.abs(Math.sin(phase*2))*.04:Math.sin(t*2)*.012);torso.rotation.x=THREE.MathUtils.damp(torso.rotation.x,air?-.15:0,7,dt);tail.rotation.z=Math.sin(t*3+phase*.4)*(.1+Math.min(sp/12,.2));
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.vel.y-=8*dt;p.mesh.position.addScaledVector(p.vel,dt);p.mesh.scale.setScalar(Math.max(.01,p.life));if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();particles.splice(i,1)}}
let dist=7.3*Math.cos(camPitch);desired.set(player.position.x+Math.sin(camYaw)*dist,player.position.y+4.5+camPitch*5,player.position.z+Math.cos(camYaw)*dist);camera.position.lerp(desired,1-Math.exp(-4.8*dt));look.lerp(new THREE.Vector3(player.position.x-Math.sin(camYaw),1.45+player.position.y,player.position.z-Math.cos(camYaw)),1-Math.exp(-7*dt));camera.lookAt(look);document.querySelector('#time').textContent=Math.ceil(remaining)}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);update(dt,clock.elapsedTime);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
